<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上課程預約系統</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .booking-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 480px;
    }
    .title {
      color: #00c853;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00c853;
    }
    .closed-days-notice {
      color: #d32f2f;
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 6px;
      min-height: 20px;
    }
    .error-message {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 6px;
      display: none;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #00c853;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover {
      background-color: #00a844;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <h2 class="title">線上課程預約</h2>

    <form id="bookingForm">
      <div class="form-group">
        <label for="bookingDate">1. 請選擇預約日期</label>
        <input type="date" id="bookingDate" required>
        <div id="closedDaysNotice" class="closed-days-notice"></div>
      </div>

      <div class="form-group">
        <label for="bookingTime">2. 請選擇可預約時段</label>
        <select id="bookingTime" required disabled>
          <option value="">-- 請先選擇日期 --</option>
        </select>
        <div id="noSlotMsg" class="error-message">該日期無開放預約時段，請選擇其他日期</div>
      </div>

      <div class="form-group">
        <label for="name">家長姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required>
      </div>

      <div class="form-group">
        <label for="phone">聯絡電話</label>
        <input type="tel" id="phone" placeholder="請輸入電話" required>
      </div>

      <div class="form-group">
        <label for="email">Email 信箱</label>
        <input type="email" id="email" placeholder="用於接收確認信" required>
      </div>

      <div class="form-group">
        <label for="note">備註事項</label>
        <textarea id="note" rows="3" placeholder="如有特殊需求請在此註明"></textarea>
      </div>

      <button type="submit" id="submitBtn">確認預約</button>
    </form>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw6MeINoJ4V8ArQqihXnYdHjYxpslMV7RFal502Q5iQEHuXRFBUwS0d7oqo8YGOHTYJQA/exec';

    const bookingDateInput = document.getElementById('bookingDate');
    const bookingTimeSelect = document.getElementById('bookingTime');
    const closedDaysNotice = document.getElementById('closedDaysNotice');
    const noSlotMsg = document.getElementById('noSlotMsg');
    const bookingForm = document.getElementById('bookingForm');
    const submitBtn = document.getElementById('submitBtn');

    // 限制只能選擇今天及未來的日期
    const today = new Date().toISOString().split('T')[0];
    bookingDateInput.min = today;

    // 初始化：獲取不開放星期
    window.addEventListener('DOMContentLoaded', function() {
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getClosedDays' })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.closedDaysText) {
          closedDaysNotice.textContent = data.closedDaysText;
        }
      })
      .catch(err => console.error('無法載入休假提示:', err));
    });

    // 日期變更
    bookingDateInput.addEventListener('change', function() {
      const selectedDate = this.value;
      if (!selectedDate) return;

      bookingTimeSelect.innerHTML = '<option value="">時段載入中...</option>';
      bookingTimeSelect.disabled = true;
      noSlotMsg.style.display = 'none';

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'getSlotsByDate',
          date: selectedDate
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          if (data.isHoliday) {
            bookingTimeSelect.innerHTML = '<option value="">-- 本日休館 / 不開放 --</option>';
            bookingTimeSelect.disabled = true;
            noSlotMsg.textContent = data.message || '該日期為不開放預約日';
            noSlotMsg.style.display = 'block';
          } else if (data.slots && data.slots.length > 0) {
            bookingTimeSelect.innerHTML = '<option value="">-- 請選擇時段 --</option>';
            data.slots.forEach(slotItem => {
              const option = document.createElement('option');
              option.value = slotItem.slot;
              option.textContent = slotItem.display;
              bookingTimeSelect.appendChild(option);
            });
            bookingTimeSelect.disabled = false;
          } else {
            bookingTimeSelect.innerHTML = '<option value="">-- 無可預約時段 --</option>';
            bookingTimeSelect.disabled = true;
            noSlotMsg.textContent = '該日期無開放預約時段，請選擇其他日期';
            noSlotMsg.style.display = 'block';
          }
        }
      })
      .catch(err => {
        console.error('抓取時段錯誤:', err);
        bookingTimeSelect.innerHTML = '<option value="">-- 載入失敗 --</option>';
      });
    });

    // 表單送出
    bookingForm.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!bookingTimeSelect.value) {
        alert('請先選擇有效的預約時段！');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '預約處理中...';

      const formData = {
        bookingTime: bookingTimeSelect.value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        note: document.getElementById('note').value,
        lineUserId: ''
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submitBooking',
          formData: formData
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('預約成功！您的預約單號為：' + data.bookingId);
          bookingForm.reset();
          bookingTimeSelect.innerHTML = '<option value="">-- 請先選擇日期 --</option>';
          bookingTimeSelect.disabled = true;
        } else {
          alert('預約失敗：' + (data.message || '未知錯誤'));
        }
      })
      .catch(err => {
        console.error('送出預約錯誤:', err);
        alert('網路連線異常，請重新嘗試。');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = '確認預約';
      });
    });
  </script>
</body>
</html>
