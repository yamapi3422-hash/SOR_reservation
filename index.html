<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上課程預約系統</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .booking-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 480px;
    }
    .title {
      color: #00c853;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00c853;
    }
    .error-message {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 6px;
      display: none;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #00c853;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover {
      background-color: #00a844;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <h2 class="title">線上課程預約</h2>

    <form id="bookingForm">
      <!-- 1. 預約日期 -->
      <div class="form-group">
        <label for="bookingDate">1. 請選擇預約日期</label>
        <input type="date" id="bookingDate" required>
      </div>

      <!-- 2. 可預約時段 -->
      <div class="form-group">
        <label for="bookingTime">2. 請選擇可預約時段</label>
        <select id="bookingTime" required disabled>
          <option value="">-- 請先選擇日期 --</option>
        </select>
        <div id="noSlotMsg" class="error-message">該日期無開放預約時段，請選擇其他日期</div>
      </div>

      <!-- 家長姓名 -->
      <div class="form-group">
        <label for="name">家長姓名</label>
        <input type="text" id="name" placeholder="請輸入姓名" required>
      </div>

      <!-- 聯絡電話 -->
      <div class="form-group">
        <label for="phone">聯絡電話</label>
        <input type="tel" id="phone" placeholder="請輸入電話" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email 信箱</label>
        <input type="email" id="email" placeholder="用於接收確認信" required>
      </div>

      <!-- 備註事項 -->
      <div class="form-group">
        <label for="note">備註事項</label>
        <textarea id="note" rows="3" placeholder="如有特殊需求請在此註明"></textarea>
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" id="submitBtn">確認預約</button>
    </form>
  </div>

  <script>
    // ⚠️ 關鍵：請將此處替換為您的 Apps Script 網頁應用程式 URL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw6MeINoJ4V8ArQqihXnYdHjYxpslMV7RFal502Q5iQEHuXRFBUwS0d7oqo8YGOHTYJQA/exec';

    const bookingDateInput = document.getElementById('bookingDate');
    const bookingTimeSelect = document.getElementById('bookingTime');
    const noSlotMsg = document.getElementById('noSlotMsg');
    const bookingForm = document.getElementById('bookingForm');
    const submitBtn = document.getElementById('submitBtn');

    // 當選擇日期變更時：向 GAS 抓取該日期的時段
    bookingDateInput.addEventListener('change', function() {
      const selectedDate = this.value;
      if (!selectedDate) return;

      // 重置選單狀態
      bookingTimeSelect.innerHTML = '<option value="">時段載入中...</option>';
      bookingTimeSelect.disabled = true;
      noSlotMsg.style.display = 'none';

      // 呼叫 GAS (getSlotsByDate)
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow', // 避免轉址阻擋
        headers: {
          'Content-Type': 'text/plain;charset=utf-8' // 避免 CORS 預檢失敗
        },
        body: JSON.stringify({
          action: 'getSlotsByDate',
          date: selectedDate
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.slots && data.slots.length > 0) {
          bookingTimeSelect.innerHTML = '<option value="">-- 請選擇時段 --</option>';
          data.slots.forEach(slotItem => {
            const option = document.createElement('option');
            option.value = slotItem.slot;
            option.textContent = slotItem.display;
            bookingTimeSelect.appendChild(option);
          });
          bookingTimeSelect.disabled = false;
        } else {
          bookingTimeSelect.innerHTML = '<option value="">-- 無可預約時段 --</option>';
          bookingTimeSelect.disabled = true;
          noSlotMsg.style.display = 'block';
        }
      })
      .catch(err => {
        console.error('抓取時段錯誤:', err);
        bookingTimeSelect.innerHTML = '<option value="">-- 載入失敗 --</option>';
        alert('無法取得預約時段，請檢查網路連線或稍後再試。');
      });
    });

    // 表單送出：將預約資料發送到 GAS (submitBooking)
    bookingForm.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!bookingTimeSelect.value) {
        alert('請先選擇有效的預約時段！');
        return;
      }

      // 按鈕防重複點擊
      submitBtn.disabled = true;
      submitBtn.textContent = '預約處理中...';

      const formData = {
        bookingTime: bookingTimeSelect.value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        note: document.getElementById('note').value,
        lineUserId: '' // 可依需要帶入 LIFF ID
      };

      // 呼叫 GAS (submitBooking)
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow', // 核心優化：允許追蹤轉址
        headers: {
          'Content-Type': 'text/plain;charset=utf-8' // 核心優化：避免 CORS 預檢失敗
        },
        body: JSON.stringify({
          action: 'submitBooking',
          formData: formData
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('預約成功！您的預約單號為：' + data.bookingId);
          bookingForm.reset();
          bookingTimeSelect.innerHTML = '<option value="">-- 請先選擇日期 --</option>';
          bookingTimeSelect.disabled = true;
        } else {
          alert('預約失敗：' + (data.message || '未知錯誤'));
        }
      })
      .catch(err => {
        console.error('送出預約錯誤:', err);
        alert('網路連線異常，請重新嘗試。');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = '確認預約';
      });
    });
  </script>
</body>
</html>
